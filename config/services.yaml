# config/services.yaml
# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # Paramètres personnalisés
    upload_directory: "%kernel.project_dir%/public/uploads"
    app.base_url: "%env(APP_BASE_URL)%"
    platform_commission_rate: "%env(int:PLATFORM_COMMISSION_RATE)%"
    withdrawal_min_amount: "%env(int:WITHDRAWAL_MIN_AMOUNT)%"

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Injecte automatiquement les dépendances
        autoconfigure: true # Enregistre automatiquement les services (commandes, event subscribers, etc.)
        public: false # Tous les services sont privés par défaut (sauf explicitement publics)

    # Makes classes in src/ available as services
    App\:
        resource: "../src/"
        exclude:
            - "../src/DependencyInjection/"
            - "../src/Entity/"
            - "../src/Kernel.php"
            - "../src/Tests/"

    App\Mailer\GmailApiTransportFactory:
        tags:
            - { name: mailer.transport_factory }

    App\Service\MailerService:
        arguments:
            $projectDir: "%kernel.project_dir%"
            $appBaseUrl: "%app.base_url%"
            $logger: "@logger"

    App\Service\WalletService:
        arguments:
            $commissionRate: "%platform_commission_rate%"

    # Exemple d'override ou service explicite si besoin
    # App\Service\MyService:
    #     arguments:
    #         $someParameter: '%app.base_url%'
