security:
    password_hashers:
        App\Entity\User:
            algorithm: auto
        App\Entity\GymOwner:
            algorithm: auto

    role_hierarchy:
        ROLE_SUPER_ADMIN: ROLE_ADMIN
        ROLE_ADMIN: ROLE_USER

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        cors:
            pattern: ^/
            methods: [OPTIONS]
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            entry_point: jwt
            jwt: ~
            refresh_jwt:
                check_path: api_refresh_token

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        # OPTIONS toujours autorisés
        - { path: ^/, roles: PUBLIC_ACCESS, methods: [OPTIONS] }

        # Auth
        - { path: ^/api/login,            roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh,    roles: PUBLIC_ACCESS }
        - { path: ^/api/register,         roles: PUBLIC_ACCESS }

        # Gym registration (SaaS)
        - { path: ^/api/gym/register,     roles: PUBLIC_ACCESS }

        # Boutique publique (globale et par salle)
        - { path: ^/api/shop/register,             roles: PUBLIC_ACCESS }
        - { path: ^/api/shop/products,             roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/shop/[^/]+/info,              roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/shop/[^/]+/products,       roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/shop/[^/]+/categories,     roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/shop/[^/]+/register,       roles: PUBLIC_ACCESS }

        # Produits publics en lecture
        - { path: ^/api/products,         roles: PUBLIC_ACCESS, methods: [GET] }

        # Catégories publiques en lecture, admin pour écriture
        - { path: ^/api/categories,       roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/categories,       roles: ROLE_ADMIN,    methods: [POST, PUT, DELETE] }

        # Boutique client connecté
        - { path: ^/api/shop/orders,      roles: ROLE_CLIENT }

        # Webhooks FedaPay (public — no JWT)
        - { path: ^/api/webhooks/fedapay, roles: PUBLIC_ACCESS }

        # QR code client (image chargée via <img>, sans header JWT — contient uniquement uuid+nom)
        - { path: ^/api/clients/\d+/qr-code, roles: PUBLIC_ACCESS, methods: [GET] }

        # Super admin
        - { path: ^/api/super-admin,      roles: ROLE_SUPER_ADMIN }
        - { path: ^/api/superadmin,       roles: ROLE_SUPER_ADMIN }

        # Tout le reste → connecté
        - { path: ^/api,                  roles: IS_AUTHENTICATED_FULLY }